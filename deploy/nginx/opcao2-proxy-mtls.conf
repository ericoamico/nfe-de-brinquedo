# nginx - OPÇÃO 2: o nginx faz o TLS mútuo e repassa o certificado cliente.
# Use junto com o nfe-brinquedo.conf (loja e consulta continuam iguais).
#
# Autorizadora: AUT_MTLS_MODO=proxy e AUT_PROXY_SEGREDO=<o mesmo valor de baixo>.
# Loja: LOJA_AUTORIZADORA_URL=https://nfe.SEU_DOMINIO e LOJA_CA_SERVIDOR=sistema.
# Certificado público: sudo certbot certonly --nginx -d nfe.SEU_DOMINIO

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nfe.SEU_DOMINIO;

    ssl_certificate     /etc/letsencrypt/live/nfe.SEU_DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nfe.SEU_DOMINIO/privkey.pem;

    # Só aceita certificado cliente emitido pela AC de brinquedo.
    ssl_client_certificate /etc/nfe-brinquedo/certs/raiz.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;

    location /ws/ {
        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host $host;
        # Sobrescreve qualquer valor vindo do cliente.
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_set_header X-Proxy-Segredo "TROQUE_PELO_AUT_PROXY_SEGREDO";
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
