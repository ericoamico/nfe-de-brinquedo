# nginx - OPÇÃO 1 (padrão): a autorizadora termina o TLS mútuo ela mesma (porta 8443).
# O nginx só publica a loja e a página de consulta.
#
# Troque SEU_DOMINIO pelo seu domínio:  sed -i 's/SEU_DOMINIO/exemplo.com.br/g' nfe-brinquedo.conf
# Certificados públicos: sudo certbot --nginx -d loja.SEU_DOMINIO -d consulta.SEU_DOMINIO

server {
    listen 80;
    listen [::]:80;
    server_name loja.SEU_DOMINIO consulta.SEU_DOMINIO;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name loja.SEU_DOMINIO;

    ssl_certificate     /etc/letsencrypt/live/loja.SEU_DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/loja.SEU_DOMINIO/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name consulta.SEU_DOMINIO;

    ssl_certificate     /etc/letsencrypt/live/consulta.SEU_DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/consulta.SEU_DOMINIO/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
